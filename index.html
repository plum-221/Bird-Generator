<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="application-name" content="Bird Generator" />
  <meta name="apple-mobile-web-app-title" content="Bird Generator" />
  <meta name="description" content="A playful procedural 3D budgie generator built with Three.js." />
  <meta property="og:title" content="Bird Generator" />
  <meta property="og:description" content="Create, customize, animate, and capture your own procedural 3D bird." />
  <title>Bird Generator</title>
  <link
    rel="preload"
    href="/src/assets/brand/bird-mascot-v2.png"
    as="image"
    fetchpriority="high"
  />
  <link
    rel="preload"
    href="/src/assets/loading/fish.png"
    as="image"
    fetchpriority="high"
  />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div
    id="initial-loader"
    class="initial-loader"
    role="status"
    aria-live="polite"
    aria-label="白色小鹦鹉正在准备画布"
  >
    <div class="initial-loader__content">
      <div class="initial-loader__mascot" aria-hidden="true">
        <span class="initial-loader__glow"></span>
        <img
          class="initial-loader__cat"
          src="/src/assets/brand/bird-mascot-v2.png"
          alt=""
          width="400"
          height="449"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        />
      </div>
      <div class="initial-loader__meter" aria-hidden="true">
        <div class="initial-loader__track">
          <span class="initial-loader__fill"></span>
          <span class="initial-loader__fish-runner">
            <img
              class="initial-loader__fish"
              src="/src/assets/loading/fish.png"
              alt=""
              width="280"
              height="164"
              decoding="async"
              fetchpriority="high"
              draggable="false"
            />
          </span>
          </div>
        </div>
        <div class="initial-loader__caption">
          <span class="initial-loader__label">正在开罐，马上就好…</span>
          <output id="initial-loader-percent" class="initial-loader__percent">7%</output>
        </div>
      </div>
  </div>
  <svg class="handdrawn-filters" aria-hidden="true">
    <defs>
      <filter id="handdrawn-wobble" x="-8%" y="-12%" width="116%" height="124%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.016 0.045"
          numOctaves="2"
          seed="23"
          result="paperNoise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="paperNoise"
          scale="2.6"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>
  <div id="app">
    <main id="viewport">
      <canvas id="scene"></canvas>
      <div
        id="scene-speech-bubble"
        class="scene-speech-bubble"
        aria-hidden="true"
        data-i18n-ignore
      ></div>
      <div id="bird-expression-overlay" class="bird-expression-overlay" aria-hidden="true" data-i18n-ignore></div>
      <div id="pet-interaction-hint" class="pet-interaction-hint" role="status">摸摸头、挠挠胸，或把玩具递给它</div>
      <div id="viewport-quick-settings" aria-label="Language">
        <div class="locale-switcher" role="group" aria-label="Language" data-i18n-ignore>
          <button type="button" data-locale="zh-CN" aria-pressed="true">中</button>
          <button type="button" data-locale="ja-JP" aria-pressed="false">日</button>
          <button type="button" data-locale="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <div id="scene-tools" aria-label="场景控制">
        <div class="music-tool">
          <button
            id="bgm-toggle"
            class="bgm-toggle"
            type="button"
            aria-label="播放背景音乐"
            aria-pressed="false"
            title="播放背景音乐"
          >
            <span class="record-label" aria-hidden="true"></span>
            <span class="record-hole" aria-hidden="true"></span>
          </button>
          <span class="record-tonearm" aria-hidden="true"></span>
          <span class="scene-tool-label">音乐</span>
        </div>
        <div class="light-tool">
          <button
            id="light-orb"
            type="button"
            aria-label="拖动光照球调整光照方向"
            title="拖动小太阳，改变光照方向"
          >
            <span id="light-orb-handle" aria-hidden="true"></span>
          </button>
          <span class="scene-tool-label">光照</span>
        </div>
        <div id="weather-control" class="weather-control" aria-label="天气">
          <span class="weather-title">天气</span>
          <div class="weather-options">
            <button type="button" class="weather-chip active" data-weather="sunny" aria-label="晴天" aria-pressed="true">☀️ 晴天</button>
            <button type="button" class="weather-chip" data-weather="cloudy" aria-label="阴天" aria-pressed="false">☁️ 阴天</button>
            <button type="button" class="weather-chip" data-weather="thunder" aria-label="打雷" aria-pressed="false" title="可与阴天或下雨叠加">⚡ 打雷</button>
            <button type="button" class="weather-chip" data-weather="fishRain" aria-label="下雨" aria-pressed="false" title="雨量和谷子量可分别调整">🌧️ 下雨</button>
          </div>
          <div class="weather-parameters" aria-label="天气参数" hidden>
            <label class="weather-parameter" for="weather-rain-amount">
              <span>雨量</span>
              <input id="weather-rain-amount" type="range" min="0" max="4" step="0.05" value="1">
              <output id="weather-rain-value" for="weather-rain-amount">1.00</output>
            </label>
            <label class="weather-parameter" for="weather-cloud-amount">
              <span>云量</span>
              <input id="weather-cloud-amount" type="range" min="0" max="2" step="0.05" value="1">
              <output id="weather-cloud-value" for="weather-cloud-amount">1.00</output>
            </label>
            <label class="weather-parameter" for="weather-fish-amount">
              <span>谷子量</span>
              <input id="weather-fish-amount" type="range" min="0" max="4" step="0.05" value="1">
              <output id="weather-fish-value" for="weather-fish-amount">1.00</output>
            </label>
          </div>
        </div>
      </div>
      <button id="outdoor-mode-toggle" class="outdoor-mode-toggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M6 25c4-8 10-13 20-17M11 19c-4-1-6-4-5-8 4-1 7 1 8 4M17 14c0-5 3-8 8-9 1 5-1 8-6 10" />
        </svg>
        <span class="outdoor-mode-toggle__label">出去散步</span>
      </button>
      <button id="toy-pack-button" class="toy-pack-button" type="button" aria-label="选择带去散步的玩具">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 12h14l3 14H6z"/><path d="M12 13V9a4 4 0 0 1 8 0v4"/><circle cx="16" cy="20" r="3"/></svg>
        <span>玩具包：铃铛</span>
      </button>
      <div id="outdoor-mobile-controls" class="outdoor-mobile-controls" hidden aria-hidden="true" aria-label="散步移动控制">
        <button type="button" data-outdoor-direction="up" aria-label="向前移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6" /></svg></button>
        <button type="button" data-outdoor-direction="left" aria-label="向左移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg></button>
        <button type="button" data-outdoor-direction="down" aria-label="向后移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6" /></svg></button>
        <button type="button" data-outdoor-direction="right" aria-label="向右移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6" /></svg></button>
      </div>
      <div id="outdoor-action-controls" class="outdoor-action-controls" hidden aria-hidden="true" aria-label="户外动作控制">
        <button id="outdoor-jump-button" type="button" aria-label="跳跃"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m8 20 8-9 8 9M16 11v15"/></svg><span>跳跃</span></button>
        <button id="outdoor-emote-button" type="button" aria-label="做表情"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path d="M11 14h.1M21 14h.1M11 20c3 3 7 3 10 0"/></svg><span>表情</span></button>
        <button id="outdoor-interact-button" type="button" aria-label="种植或收获"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27V12M16 18c-6 0-9-3-9-8 6 0 9 3 9 8ZM16 15c0-6 3-9 9-9 0 6-3 9-9 9Z"/></svg><span>种菜</span></button>
        <button id="outdoor-build-button" type="button" aria-label="搭建房屋"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m5 15 11-9 11 9v12H5zM12 27v-8h8v8"/></svg><span>建造</span></button>
        <button id="outdoor-toy-button" type="button" aria-label="取出或收回玩具"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 25c-4-3-3-9 2-10-1-5 6-8 9-4 5 0 7 7 3 10-2 4-9 6-14 4Z"/><path d="m14 15 5 5M19 15l-5 5"/></svg><span>玩具</span></button>
      </div>
      <section id="outdoor-game-hud" class="outdoor-game-hud" hidden aria-label="户外游戏状态" data-i18n-ignore>
        <div class="outdoor-game-hud__card"><span>菜地</span><strong id="outdoor-farm-status">4 格空地</strong></div>
        <div class="outdoor-game-hud__card"><span>小屋</span><strong id="outdoor-build-status">等待地基</strong></div>
        <div class="outdoor-game-hud__card"><span>玩具</span><strong id="outdoor-toy-status">铃铛 · 已收好</strong></div>
        <p id="outdoor-context-hint">WASD 移动 · 拖动画面转视角 · Space 跳跃 · Q 表情</p>
      </section>
      <div id="outdoor-npc-bubble" class="outdoor-npc-bubble" role="status" aria-live="polite" aria-hidden="true" data-i18n-ignore>
        <strong id="outdoor-npc-bubble-name"></strong>
        <span id="outdoor-npc-bubble-text"></span>
      </div>
      <div id="lightning-flash" aria-hidden="true"></div>
      <svg id="lightning-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path id="lightning-outline" class="lightning-outline"></path>
        <path id="lightning-core" class="lightning-core"></path>
      </svg>
      <div id="viewport-hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
    </main>
    <aside id="panel" class="mobile-panel-collapsed">
      <div class="mobile-panel-toolbar">
        <button
          id="mobile-panel-toggle"
          class="mobile-panel-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="controls"
          aria-label="展开参数面板"
        >
          <span class="mobile-panel-toggle__label">展开参数</span>
          <span class="mobile-panel-toggle__chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="panel-actions">
          <button id="btn-random" class="btn primary">🪶 随机遇见小鸟</button>
          <div class="btn-row">
            <button id="btn-export-glb" class="btn">带走 GLB</button>
            <button id="btn-export-png" class="btn">留影 PNG</button>
          </div>
          <button
            id="btn-codex-pet"
            class="btn codex-pet-entry"
            type="button"
            aria-haspopup="dialog"
          >
            <span>🪶 导出给 Codex</span>
            <small>Experimental</small>
          </button>
        </div>
        <nav id="mobile-section-nav" class="mobile-section-nav" aria-label="参数分类"></nav>
      </div>
      <div id="controls"></div>
      <footer class="panel-footer">
        <div class="panel-brand-footer">
          <img
            class="panel-footer-logo"
            src="/src/assets/brand/bird-mascot-v2.png"
            alt="Bird Generator 白色鹦鹉吉祥物"
            width="1536"
            height="1024"
            loading="lazy"
            decoding="async"
            draggable="false"
          />
        </div>
      </footer>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
